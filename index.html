<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizim Zaman Kapsülümüz 🤎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #F3EBDD;
      color: #5A4636;
    }

    /* ŞİFRE EKRANI */
    #kilit {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        linear-gradient(rgba(107,112,92,0.12), rgba(90,70,54,0.10)),
        #F3EBDD;
    }

    .kilit-karti {
      width: 100%;
      max-width: 380px;
      background: #FAF6EE;
      border: 1px solid #A5A58D;
      border-radius: 24px;
      padding: 38px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(90,70,54,0.18);
    }

    .kilit-karti .ikon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .kilit-karti h1 {
      color: #5F654F;
      margin: 5px 0 12px;
      font-size: 29px;
    }

    .kilit-karti p {
      color: #796755;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #A5A58D;
      background: #F3EBDD;
      color: #5A4636;
      text-align: center;
      font-size: 18px;
      outline: none;
      margin-bottom: 13px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #6B705C;
      color: #FFFDF7;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #hata {
      color: #8A5548;
      min-height: 22px;
      font-size: 14px;
      margin-top: 12px;
    }

    /* ZAMAN KAPSÜLÜ */
    #kapsul {
      display: none;
      padding: 35px 20px 60px;
      text-align: center;
    }

    .ust-yazi {
      font-size: 13px;
      letter-spacing: 3px;
      color: #8A806E;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #kapsul h1 {
      color: #5F654F;
      font-size: 36px;
      margin: 5px 0 10px;
    }

    .alt-yazi {
      color: #796755;
      font-size: 18px;
      margin-bottom: 28px;
    }

    .fotograf {
      width: 100%;
      max-width: 600px;
      display: block;
      margin: 0 auto;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(90,70,54,0.22);
    }

    .ani-karti {
      max-width: 600px;
      margin: 25px auto 0;
      background: #FAF6EE;
      border: 1px solid #C9C2AE;
      border-radius: 20px;
      padding: 22px;
      color: #5A4636;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div id="kilit">
    <div class="kilit-karti">
      <div class="ikon">🔐</div>
      <h1>Bizim Zaman Kapsülümüz</h1>
      <p>Bu kapsül sadece doğru anahtarı bilenlere ait. 🌿</p>

      <input
        type="password"
        id="sifre"
        placeholder="Şifreyi gir..."
      >

      <button onclick="kapsuluAc()">Kapsülü Aç 🤎</button>

      <div id="hata"></div>
    </div>
  </div>
<div id="kapsul">
 <div class="ust-yazi">ZAMANIN ÖTESİNDE</div>
 <h1>Bizim Zaman Kapsülümüz 🤎</h1>

  <div class="alt-yazi">
  Bunlar sadece fotoğraf değil, bizim hikâyemizin parçaları.
</div>
    <img
      class="fotograf"
      src="IMG_20260327_031018_442.webp"
      alt="Zaman kapsülü"
    >
<img
  class="fotograf"
  src="IMG-20260323-WA0030.jpg"
  alt="Bizden bir anı"
>
  
    <div class="ani-karti">
  Buraya zamanla daha çok anı, daha çok fotoğraf ve daha çok biz eklenecek. 🌿
</div>
  </div>
</div>
  <script>
    function kapsuluAc() {
      const sifre = document.getElementById("sifre").value;

      if (sifre === "240625") {
        document.getElementById("kilit").style.display = "none";
        document.getElementById("kapsul").style.display = "block";
      } else {
        document.getElementById("hata").innerText =
          "Anahtar bu değil... 🤎";
      }
    }

    document.getElementById("sifre").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        kapsuluAc();
      }
    });
  </script>

</body>
</html>
